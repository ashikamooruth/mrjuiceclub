<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <title>Mr Juice Club</title>
  <style>
    :root{
      --green:#2f8f3a;
      --orange:#ff8a00;
      --ink:#203020;
      --muted:#667266;
      --paper:#fffdf7;
      --line:#e5e9e0;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 15% 0%, #eff9e8 0, transparent 28%),
        radial-gradient(circle at 100% 10%, #fff0db 0, transparent 30%),
        var(--paper);
      min-height:100vh;
    }
    .wrap{width:min(620px,92%);margin:0 auto;padding:34px 0 50px}
    .brand{text-align:center;margin-bottom:22px}
    .brand h1{margin:0;font-size:42px;line-height:1;color:var(--green);font-weight:900}
    .brand h1 span{color:var(--orange)}
    .brand .club{font-size:18px;letter-spacing:.18em;font-weight:800;margin-top:8px}
    .brand p{margin:8px 0 0;color:var(--muted)}
    .card{
      background:rgba(255,255,255,.94);
      border:1px solid var(--line);
      border-radius:24px;
      padding:26px;
      box-shadow:0 18px 55px rgba(42,75,42,.09);
    }
    label{display:block;font-weight:750;margin:0 0 7px}
    .field{margin-bottom:18px}
    input,select{
      width:100%;font:inherit;padding:14px 15px;border-radius:13px;
      border:1px solid #cfd8ca;background:#fff;outline:none;
    }
    input:focus,select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(47,143,58,.12)}
    .phone{display:flex;gap:8px}
    .prefix{
      flex:0 0 77px;display:flex;align-items:center;justify-content:center;
      background:#f4f7f1;border:1px solid #cfd8ca;border-radius:13px;font-weight:800
    }
    .hint{font-size:12px;color:var(--muted);margin-top:6px}
    .consent{display:flex;gap:10px;align-items:flex-start;margin:8px 0 22px}
    .consent input{width:auto;margin-top:4px}
    .consent label{font-weight:500;font-size:13px;color:#4d574d;margin:0}
    button{
      width:100%;border:0;border-radius:14px;padding:15px 18px;
      font:inherit;font-weight:900;letter-spacing:.02em;color:#fff;
      background:linear-gradient(90deg,var(--green),#3ca947);
      cursor:pointer;
    }
    button:disabled{opacity:.58;cursor:wait}
    .msg{display:none;margin-top:17px;border-radius:13px;padding:14px 15px;font-size:14px}
    .msg.ok{display:block;background:#edf8ed;border:1px solid #bcdcbc;color:#245f2a}
    .msg.err{display:block;background:#fff0ee;border:1px solid #efc4bd;color:#8a3027}
    .benefits{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px;text-align:center}
    .benefit{font-size:12px;color:#5d675d;background:#f8faf5;border-radius:12px;padding:11px 6px}
    footer{text-align:center;margin-top:18px;color:#7a827a;font-size:12px}
    @media(max-width:520px){
      .wrap{padding-top:23px}.brand h1{font-size:36px}.card{padding:20px}
      .benefits{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="brand">
      <h1>MR <span>JUICE</span></h1>
      <div class="club">CLUB</div>
      <p>Sip. Earn. Enjoy.</p>
    </section>

    <form class="card" id="joinForm">
      <div class="field">
        <label for="name">Full name *</label>
        <input id="name" name="name" maxlength="64" autocomplete="name" required />
      </div>

      <div class="field">
        <label for="phone">Mobile number *</label>
        <div class="phone">
          <div class="prefix">+230</div>
          <input id="phone" name="phone" inputmode="numeric" autocomplete="tel"
                 placeholder="5XXX XXXX" maxlength="14" required />
        </div>
        <div class="hint">Your mobile number is your Mr Juice Club membership ID.</div>
      </div>

      <div class="field">
        <label for="birthday">Birthday <span style="font-weight:500">(optional)</span></label>
        <input id="birthday" name="birthday" type="date" />
      </div>

      <div class="field">
        <label for="email">Email <span style="font-weight:500">(optional)</span></label>
        <input id="email" name="email" type="email" maxlength="100" autocomplete="email" />
      </div>

      <div class="consent">
        <input id="consent" name="consent" type="checkbox" required />
        <label for="consent">I agree to join Mr Juice Club and receive loyalty-related offers and rewards. I can opt out of marketing communications later.</label>
      </div>

      <button id="submitBtn" type="submit">JOIN MR JUICE CLUB</button>
      <div id="message" class="msg" role="status" aria-live="polite"></div>

      <div class="benefits">
        <div class="benefit">⭐ Earn rewards when you buy</div>
        <div class="benefit">🎂 Birthday surprises</div>
        <div class="benefit">🥤 Member-only offers</div>
      </div>
    </form>

    <footer>Mr Juice Club · Mauritius</footer>
  </main>

<script>
  const params = new URLSearchParams(location.search);
  const outlet = (params.get('store') || 'unspecified').slice(0,40);

  const form = document.getElementById('joinForm');
  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('message');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.className = 'msg';
    msg.textContent = '';
    btn.disabled = true;
    btn.textContent = 'JOINING...';

    const payload = {
      name: document.getElementById('name').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      birthday: document.getElementById('birthday').value || '',
      email: document.getElementById('email').value.trim(),
      consent: document.getElementById('consent').checked,
      outlet
    };

    try {
      const res = await fetch('/api/register', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(payload)
      });
      const data = await res.json().catch(() => ({}));

      if (!res.ok) throw new Error(data.error || 'Registration could not be completed.');

      msg.className = 'msg ok';
      msg.textContent = data.existing
        ? 'You are already a Mr Juice Club member. Give your mobile number at the counter when you order.'
        : '🎉 Welcome to Mr Juice Club! Your membership is active. Give your mobile number at the counter when you order.';
      if (!data.existing) form.reset();
    } catch (err) {
      msg.className = 'msg err';
      msg.textContent = err.message || 'Something went wrong. Please try again.';
    } finally {
      btn.disabled = false;
      btn.textContent = 'JOIN MR JUICE CLUB';
    }
  });
</script>
</body>
</html>
